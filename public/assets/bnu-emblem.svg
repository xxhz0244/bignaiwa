<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="北京师范大学">
  <!-- 北师大红 -->
  <g fill="none" stroke="#9E1B32" stroke-width="5">
    <circle cx="200" cy="200" r="192"/>
    <circle cx="200" cy="200" r="150"/>
  </g>

  <!-- 校名（上弧） / 英文名（下弧） -->
  <defs>
    <path id="arcTop" d="M 66 200 A 134 134 0 0 1 334 200"/>
    <path id="arcBot" d="M 334 200 A 134 134 0 0 0 66 200"/>
  </defs>
  <g fill="#9E1B32" font-family="'Songti SC','STSong','SimSun',serif" font-weight="700">
    <text font-size="30" letter-spacing="6">
      <textPath href="#arcTop" startOffset="50%" text-anchor="middle">北京师范大学</textPath>
    </text>
    <text font-size="14.5" letter-spacing="1.5">
      <textPath href="#arcBot" startOffset="50%" text-anchor="middle">BEIJING NORMAL UNIVERSITY</textPath>
    </text>
  </g>

  <!-- 中央木铎（铎） -->
  <g>
    <!-- 钮 / 提梁 -->
    <path d="M186 132 C186 106 214 106 214 132" fill="none" stroke="#9E1B32" stroke-width="6"/>
    <!-- 铎身 -->
    <path d="M172 134 L172 150
             C172 168 146 178 140 214
             L134 250 Q200 274 266 250
             L260 214 C254 178 228 168 228 150
             L228 134 Z"
          fill="#9E1B32"/>
    <!-- 乳钉装饰 -->
    <g fill="#fff">
      <circle cx="176" cy="184" r="4"/>
      <circle cx="166" cy="206" r="4"/>
      <circle cx="160" cy="228" r="4"/>
      <circle cx="224" cy="184" r="4"/>
      <circle cx="234" cy="206" r="4"/>
      <circle cx="240" cy="228" r="4"/>
    </g>
    <!-- 铎舌（小铃舌） -->
    <circle cx="200" cy="244" r="8" fill="#fff"/>
  </g>

  <!-- 建校年份 -->
  <text x="200" y="330" text-anchor="middle" fill="#9E1B32"
        font-size="19" font-family="'Songti SC','STSong','SimSun',serif" font-weight="700" letter-spacing="3">1902</text>
</svg>
